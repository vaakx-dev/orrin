[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
orrin-core = { path = "crates/orrin-core" }
orrin-store = { path = "crates/orrin-store" }
orrin-projects = { path = "crates/orrin-projects" }
orrin-views = { path = "crates/orrin-views" }
orrin-landing = { path = "crates/orrin-landing" }
orrin-merge = { path = "crates/orrin-merge" }
orrin-index = { path = "crates/orrin-index" }
orrin-facts = { path = "crates/orrin-facts" }
orrin-builds = { path = "crates/orrin-builds" }
orrin-sync = { path = "crates/orrin-sync" }
orrin-git = { path = "crates/orrin-git" }
orrin-server = { path = "crates/orrin-server" }

tokio = { version = "1.53.3", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
blake3 = "1.8.7"
fastcdc = "5.0.0"
zip = "9.0.4"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
gix = "0.89.0"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-gdscript = "6.1.0"
regex-syntax = "0.8.11"
winreg = "0.56.0"
quick-xml = "0.42.0"
regex = "1.13.1"
globset = "0.4.20"
walkdir = "2.5.0"
ignore = "0.4.33"
similar = "3.2.0"
base64 = "0.23.1"
hex = "0.4.3"
dirs = "7.0.0"
tempfile = "3.27.0"
windows-sys = "0.61.2"
windows = "0.62.2"
